# Render Blueprint: https://render.com/docs/blueprint-spec
# Render dashboard -> New -> Blueprint -> pick this repository. Creates the web app and a PostgreSQL database.
services:
  - type: web
    name: faceguard
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free            # free instances sleep after 15 min idle; use "starter" for always-on
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true          # Render creates a random secret once
      - key: DATABASE_URL
        fromDatabase:
          name: faceguard-db
          property: connectionString
      - key: ADMIN_EMAILS
        sync: false                  # your e-mail: that account becomes administrator at its next sign-in
      - key: REGISTRATION_ENABLED
        value: "true"                # set to "false" after you have created your accounts
    # Datasets are files. On the free plan they are lost on every redeploy; on a paid plan uncomment this disk.
    # disk:
    #   name: faceguard-data
    #   mountPath: /srv/data
    #   sizeGB: 1

databases:
  - name: faceguard-db
    plan: free                       # Render deletes free databases after 30 days; use "basic-256mb" to keep data
    databaseName: faceguard
    user: faceguard
