# Public entry point (HTTP). The only service that publishes a port. See gateway-tls.conf for HTTPS.
#   /api/*  -> backend (FastAPI)        everything else -> frontend (static SPA)
upstream backend  { server backend:8000; keepalive 16; }
upstream frontend { server frontend:8080; }

# Brute-force protection in front of the application's own limiter (per client IP).
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m    rate=30r/s;
limit_req_status 429;

server {
  listen 8080;
  server_name _;
  server_tokens off;

  # Must be larger than MAX_VIDEO_MB (50) plus multipart overhead; the API enforces the exact limits.
  client_max_body_size 60m;

  include /etc/nginx/snippets/security-headers.conf;

  location = /nginx-health { access_log off; default_type text/plain; return 200 "ok"; }

  # API docs are served by the backend directly in development only (see docker-compose.dev.yml). The strict
  # Content-Security-Policy below would break Swagger UI's CDN assets, and docs should be off in production anyway.
  location ~ ^/api/(docs|redoc|openapi\.json) { return 404; }

  # Credential endpoints get the strict limit. Token refresh is routine background traffic, so it uses the general API zone.
  location ~ ^/api/auth/(login|register|forgot-password|reset-password)$ {
    limit_req zone=login burst=5 nodelay;
    include /etc/nginx/snippets/proxy-api.conf;
  }

  location /api/ {
    limit_req zone=api burst=60 nodelay;
    include /etc/nginx/snippets/proxy-api.conf;
  }

  location / {
    proxy_pass http://frontend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
