# HTTPS gateway: redirects HTTP to HTTPS and terminates TLS. Used by docker-compose.tls.yml.
# Certificates are mounted at /etc/nginx/certs/{fullchain.pem,privkey.pem}.
upstream backend  { server backend:8000; keepalive 16; }
upstream frontend { server frontend:8080; }

limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m    rate=30r/s;
limit_req_status 429;

server {
  listen 8080;
  server_name _;
  server_tokens off;
  location = /nginx-health { access_log off; default_type text/plain; return 200 "ok"; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 8443 ssl;
  http2 on;
  server_name _;
  server_tokens off;
  client_max_body_size 60m;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  include /etc/nginx/snippets/security-headers.conf;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  location ~ ^/api/(docs|redoc|openapi\.json) { return 404; }

  # Credential endpoints get the strict limit. Token refresh is routine background traffic, so it uses the general API zone.
  location ~ ^/api/auth/(login|register|forgot-password|reset-password)$ {
    limit_req zone=login burst=5 nodelay;
    include /etc/nginx/snippets/proxy-api.conf;
  }
  location /api/ {
    limit_req zone=api burst=60 nodelay;
    include /etc/nginx/snippets/proxy-api.conf;
  }
  location / {
    proxy_pass http://frontend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
