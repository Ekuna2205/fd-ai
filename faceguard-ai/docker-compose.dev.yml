# Development extras. Use together with the main file:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# Publishes the database and backend on 127.0.0.1 ONLY (never on the network), enabling API docs.
services:
  db:
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    networks: [data, edge]    # a published port needs a non-internal network
  backend:
    ports: ["127.0.0.1:${BACKEND_PORT:-8000}:8000"]
    environment:
      ENVIRONMENT: development
      DOCS_ENABLED: "true"    # http://localhost:8000/api/docs
