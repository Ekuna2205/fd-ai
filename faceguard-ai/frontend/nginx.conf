# Static file server for the built single-page app. Public traffic reaches it only through the gateway.
server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok"; }

  # Vite fingerprints asset names, so they can be cached forever.
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

  # Single-page app: unknown paths fall back to index.html (client-side routing). Never cache the entry point.
  location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}
