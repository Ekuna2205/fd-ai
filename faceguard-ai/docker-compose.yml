# FaceGuard AI: PostgreSQL + backend + frontend + Nginx gateway.
# Only the gateway publishes a port. The database and backend are reachable only on internal Docker networks.
# Requires a .env file next to this file (copy .env.example and replace every CHANGE_ME).
name: faceguard

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-faceguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-faceguard}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      POSTGRES_USER: ${POSTGRES_USER:-faceguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-faceguard}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-30}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
      PASSWORD_RESET_MINUTES: ${PASSWORD_RESET_MINUTES:-30}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      DOCS_ENABLED: ${DOCS_ENABLED:-false}
      MAX_IMAGE_MB: ${MAX_IMAGE_MB:-10}
      MAX_VIDEO_MB: ${MAX_VIDEO_MB:-50}
      MAX_VIDEO_SECONDS: ${MAX_VIDEO_SECONDS:-30}
      RETENTION_DAYS: ${RETENTION_DAYS:-0}
      MIN_EVAL_SAMPLES: ${MIN_EVAL_SAMPLES:-200}
      FACE_DETECTOR: ${FACE_DETECTOR:-auto}
      LIVENESS_UNCERTAINTY_MARGIN: ${LIVENESS_UNCERTAINTY_MARGIN:-0.1}
      LIVENESS_REQUIRE_QUALITY: ${LIVENESS_REQUIRE_QUALITY:-true}
      MAX_MODEL_MB: ${MAX_MODEL_MB:-50}
      CHALLENGE_TTL_SECONDS: ${CHALLENGE_TTL_SECONDS:-120}
      DATA_DIR: /srv/data
      # Trust X-Forwarded-For from the gateway. Safe here only because the backend has no published port.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - appdata:/srv/data   # datasets live here; back it up like the database
    networks: [data, edge]

  frontend:
    build: ./frontend
    restart: unless-stopped
    networks: [edge]

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    volumes:
      - ./infrastructure/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/nginx/snippets:/etc/nginx/snippets:ro
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    networks: [edge]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/nginx-health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  data:
    internal: true   # database traffic never leaves this network (no internet, no host access)
  edge: {}

volumes:
  pgdata:
  appdata:
